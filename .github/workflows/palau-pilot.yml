name: Palau pilot checks

on:
  push:
    branches: ["pilot/palau-private"]
  pull_request:
    paths:
      - "src/**"
      - "supabase/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/palau-pilot.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run test:rls
      - run: npm run build:pilot
      - run: node tests/trip-foundation-gate.mjs disabled
      - run: node tests/journey-build-gate.mjs disabled
      - run: node tests/pilot-isolation.mjs
      - run: node --test tests/pilot-host.mjs
      - run: npm run test:private-bundle
      - run: node scripts/prepare-pilot-host.mjs
      - name: Build gated general foundation without publishing
        run: npm run build:pilot
        env:
          VITE_VYBR_TRIP_FOUNDATION_ENABLED: 'true'
          VITE_VYBR_JOURNEY_ENABLED: 'true'
      - run: node tests/trip-foundation-gate.mjs enabled
      - run: node tests/journey-build-gate.mjs enabled
      - run: node tests/pilot-isolation.mjs
      - run: npm run test:private-bundle
      - name: Lint pilot authentication
        run: npx eslint src/PilotApp.tsx src/pilot-main.tsx src/lib/pilotAuth.ts src/lib/pilotSupabase.ts src/pages/PilotSignInPage.tsx src/pages/PilotAuthFeedback.tsx src/pages/TripDashboardPage.tsx src/lib/tripDashboard.ts vite.config.ts
      - name: Lint pilot source
        run: npx eslint src/App.tsx src/LegacyApp.tsx src/lib/palauPilot.ts src/lib/privateTripAccess.ts src/lib/privateTripWorkspace.ts src/lib/privateTripPresentation.ts src/lib/privateJourney.ts src/lib/supabase.ts src/pages/PrivateJourney.tsx src/pages/PalauPilotPage.tsx src/pages/PrivateTripAccessPage.tsx src/pages/PrivateTripWorkspace.tsx src/components/activetrip/JournalEntryCard.tsx
